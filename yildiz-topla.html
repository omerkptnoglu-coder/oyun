<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oyun</title>
<style>
  body { margin:0; background:#1a1a2e; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
  canvas { background:#16213e; border-radius:8px; margin-top:12px; max-width:100%; touch-action:none; }
</style>
</head>
<body>
<h2>Yıldız Topla ⭐</h2>
<p>Sepeti ← → tuşlarıyla (veya parmağınla) hareket ettir, yıldızları yakala!</p>
<canvas id="c" width="400" height="500"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let x = 170, skor = 0, can = 3, yildizlar = [], tuslar = {};
addEventListener('keydown', e => tuslar[e.key] = true);
addEventListener('keyup', e => tuslar[e.key] = false);
c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); x = (e.clientX - r.left) * c.width / r.width - 30; });
function dongu() {
  if (tuslar.ArrowLeft) x -= 6;
  if (tuslar.ArrowRight) x += 6;
  x = Math.max(0, Math.min(340, x));
  if (Math.random() < 0.03) yildizlar.push({ x: Math.random() * 380 + 10, y: 0, h: 2 + Math.random() * 2 + skor / 20 });
  ctx.clearRect(0, 0, 400, 500);
  ctx.font = '24px sans-serif';
  yildizlar.forEach(s => { s.y += s.h; ctx.fillText('⭐', s.x - 12, s.y); });
  yildizlar = yildizlar.filter(s => {
    if (s.y > 470 && s.y < 490 && s.x > x && s.x < x + 60) { skor++; return false; }
    if (s.y > 500) { can--; return false; }
    return true;
  });
  ctx.fillStyle = '#e94560'; ctx.fillRect(x, 475, 60, 15);
  ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif';
  ctx.fillText('Skor: ' + skor + '   Can: ' + '❤️'.repeat(Math.max(0, can)), 10, 25);
  if (can <= 0) {
    ctx.font = '32px sans-serif'; ctx.fillText('Oyun Bitti!', 120, 240);
    ctx.font = '18px sans-serif'; ctx.fillText('Tekrar için tıkla', 135, 275);
    c.onclick = () => { skor = 0; can = 3; yildizlar = []; c.onclick = null; requestAnimationFrame(dongu); };
    return;
  }
  requestAnimationFrame(dongu);
}
dongu();
</script>
</body>
</html>
